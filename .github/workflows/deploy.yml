name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # MEMO: 現在利用していない
  # repository_dispatch:
  #   # 各アプリリポジトリからリリース完了時に以下のコマンドで通知する:
  #   # gh api -X POST repos/seriwb/my-apps/dispatches \
  #   #   -f event_type=app-released \
  #   #   -f client_payload[app_id]=picture-converter
  #   types: [app-released]
  workflow_dispatch:
  # MEMO: リリースノートを更新してからデプロイするフローにするため、コメントアウト
  # workflow_run:
  #   # update-app-meta.ymlのGITHUB_TOKEN pushは他ワークフローを起動しないため
  #   # workflow_runで連鎖させる
  #   workflows: ["Update App Metadata"]
  #   types: [completed]
  #   branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # workflow_runは失敗時にも発火するため、成功時のみ実行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version は package.json の packageManager フィールドから自動検出

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: 'pnpm'

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: 静的HTMLを生成
        run: pnpm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: GitHub Pagesにデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
