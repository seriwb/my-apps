<article class="card">
  <div class="card-header">
    <img class="card-icon" src="{{ROOT}}{{ICON}}" alt="{{NAME}} icon" width="48" height="48" />
    <div>
      <h2 class="card-title">{{NAME}}</h2>
      <p class="card-tagline">{{TAGLINE}}</p>
    </div>
  </div>
  <div class="card-platforms">
    {{PLATFORM_BADGES}}
  </div>
  <div class="card-footer">
    <span class="card-version">{{VERSION}}</span>
    <a class="btn-secondary" href="{{ROOT}}apps/{{ID}}.html">詳細を見る →</a>
  </div>
</article>
