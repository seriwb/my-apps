<!doctype html>
<html lang="ja">

<head>
  {{HEAD}}
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a class="back-link" href="{{ROOT}}index.html">← seriwb apps</a>
    </div>
  </header>

  <main class="container">
    <section class="app-hero">
      <img class="app-hero-icon" src="{{ROOT}}{{ICON}}" alt="{{NAME}} icon" width="80" height="80" />
      <div>
        <h1 class="app-hero-title">{{NAME}}</h1>
        <p class="app-hero-tagline">{{TAGLINE}}</p>
        <div class="app-platforms">{{PLATFORM_BADGES}}</div>
      </div>
    </section>

    <section class="app-section">
      <h2 class="section-title">ダウンロード</h2>
      <div class="download-grid">
        {{DOWNLOAD_BUTTONS}}
      </div>
      {{NOTES}}
    </section>

    <section class="app-section">
      <h2 class="section-title">説明</h2>
      <p class="app-description">{{DESCRIPTION}}</p>
    </section>

    <section class="app-section">
      <h2 class="section-title">主な機能</h2>
      <ul class="feature-list">
        {{FEATURES}}
      </ul>
    </section>

    {{SCREENSHOTS_SECTION}}

    <p class="app-updated">{{UPDATED}}</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© seriwb · <a href="https://github.com/seriwb" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>
</body>

</html>
